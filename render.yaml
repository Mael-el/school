services:
  - type: web
    name: school-fees-monitoring
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-fees-db
          property: connectionString
      - key: WEB_SERVER
        value: "1"
      - key: WEB_HOST
        value: 0.0.0.0
      - key: WEB_COOKIE_SECURE
        value: "1"
      - key: WEB_ADMIN_USERNAME
        value: admin
      - key: WEB_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: school-fees-db
    databaseName: school_fees
    user: school_fees
    plan: free
